services:
  - type: web
    name: benefix
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_PATH
        value: /var/data/benefix.db
    disk:
      name: benefix-data
      mountPath: /var/data
      sizeGB: 1
