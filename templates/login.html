{% extends "base.html" %}
{% block title %}Ingresar | Benefix{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="auth-card">
        <div class="text-center mb-4">
            <img class="auth-logo" src="{{ url_for('static', filename='img/benefix-logo.svg') }}" alt="Benefix">
            <h1>Iniciar sesion</h1>
            <p>Entra a tu panel Benefix.</p>
        </div>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" class="vstack gap-3">
            <label class="form-label">Correo
                <input class="form-control" type="email" name="correo" required>
            </label>
            <label class="form-label">Contrasena
                <input class="form-control" type="password" name="password" required>
            </label>
            <button class="btn btn-success btn-lg" type="submit">Entrar</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('registro') }}">Crear cuenta</a>
            <a href="{{ url_for('recuperar') }}">Recuperar contrasena</a>
        </div>
    </section>
</main>
{% endblock %}
