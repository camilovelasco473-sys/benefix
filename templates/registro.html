{% extends "base.html" %}
{% block title %}Registro | Benefix{% endblock %}

{% block content %}
<main class="auth-shell">
    <section class="auth-card">
        <div class="text-center mb-4">
            <img class="auth-logo" src="{{ url_for('static', filename='img/benefix-logo.svg') }}" alt="Benefix">
            <h1>Crear cuenta</h1>
            <p>Tu tarjeta digital se genera automaticamente.</p>
        </div>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" class="vstack gap-3">
            <label class="form-label">Nombre
                <input class="form-control" type="text" name="nombre" required>
            </label>
            <label class="form-label">Correo
                <input class="form-control" type="email" name="correo" required>
            </label>
            <label class="form-label">Contrasena
                <input class="form-control" type="password" name="password" required>
            </label>
            <button class="btn btn-success btn-lg" type="submit">Registrarme</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('login') }}">Ya tengo cuenta</a>
        </div>
    </section>
</main>
{% endblock %}
